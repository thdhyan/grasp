seed: 3001
device: cuda:0
num_steps_per_env: 16
max_iterations: 2000
empirical_normalization: null
obs_groups: {}
clip_actions: null
save_interval: 50
experiment_name: spot_grasp
run_name: ''
logger: wandb
neptune_project: isaaclab
wandb_project: Isaac-Spot-Arm-Locomotion
resume: true
load_run: 2025-12-15_20-16-26
load_checkpoint: model_1600.pt
class_name: OnPolicyRunner
policy:
  class_name: ActorCritic
  init_noise_std: 1.0
  noise_std_type: scalar
  actor_obs_normalization: false
  critic_obs_normalization: false
  actor_hidden_dims:
  - 256
  - 128
  - 64
  critic_hidden_dims:
  - 256
  - 128
  - 64
  activation: elu
algorithm:
  class_name: PPO
  num_learning_epochs: 5
  num_mini_batches: 4
  learning_rate: 0.0001
  schedule: adaptive
  gamma: 0.99
  lam: 0.95
  entropy_coef: 0.005
  desired_kl: 0.01
  max_grad_norm: 1.0
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  clip_param: 0.2
  normalize_advantage_per_mini_batch: false
  rnd_cfg: null
  symmetry_cfg: null
